name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  hygiene:
    name: hygiene (secrets, artifacts, workflow + Dockerfile lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secret / artifact scan
        run: python3 scripts/check_repo_hygiene.py
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint (backend)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: backend/Dockerfile, failure-threshold: warning, ignore: DL3008 }
      - name: hadolint (frontend)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: frontend/Dockerfile, failure-threshold: warning, ignore: DL3018 }

  backend-sqlite:
    name: backend (SQLite) — tests, migrations, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pip-audit
      - name: Migrations from scratch + model/migration drift check
        working-directory: backend
        env: { DATABASE_URL: "sqlite:////tmp/ci-migrations.db" }
        run: alembic upgrade head && alembic check
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

  backend-postgres:
    name: backend (PostgreSQL 17) — tests, migrations, live concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        # Ephemeral CI service bound to the runner only: no password needed (trust auth), so none is stored here.
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG: postgresql+psycopg://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Create disposable databases
        run: for db in aptiguard_test aptiguard_mig_test aptiguard_conc_test; do psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE $db"; done
      - name: Migrations from scratch, drift check, downgrade/upgrade round-trip
        working-directory: backend
        env: { DATABASE_URL: "${{ env.PG }}/aptiguard_mig_test" }
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic check && .venv/bin/alembic downgrade 0003 && .venv/bin/alembic upgrade head
      - name: Full test suite on PostgreSQL
        working-directory: backend
        env: { TEST_DATABASE_URL: "${{ env.PG }}/aptiguard_test" }
        run: .venv/bin/python -m pytest -q
      - name: Live multi-worker concurrency check
        env: { DATABASE_URL: "${{ env.PG }}/aptiguard_conc_test" }
        run: |
          backend/.venv/bin/python scripts/seed_demo.py
          backend/.venv/bin/uvicorn app.main:app --app-dir backend --port 8002 --workers 4 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8002/api/v1/ready && break; sleep 1; done
          backend/.venv/bin/python scripts/concurrency_check.py --api http://127.0.0.1:8002
          if grep -q "Exception in ASGI" /tmp/api.log; then cat /tmp/api.log; exit 1; fi

  frontend:
    name: frontend — typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    name: browser E2E (Playwright, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }

  docker:
    name: docker — build, demo + production stacks, failure cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [hygiene]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose version
      - run: bash scripts/docker_smoke.sh
      - if: failure()
        run: |
          docker compose -p agsmoke logs --no-color > docker-logs.txt 2>&1 || true
          docker compose -p agprod -f docker-compose.yml -f docker-compose.prod.yml logs --no-color >> docker-logs.txt 2>&1 || true
          cp /tmp/neg*.log . 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: docker-logs, path: "docker-logs.txt\nneg*.log", retention-days: 7 }
